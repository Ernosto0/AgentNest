[project]
name = "agentnest-backend"
version = "0.1.0"
description = "AgentNest backend: API, worker and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "httpx2>=2.13.1",  # the OpenAI SDK 3.x HTTP client; the stub transport in tests
    "babel>=2.15",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # zoneinfo database on Windows
    "openai>=3.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PT"]
ignore = [
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011", "PT018"]
"app/cli.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "commits: test performs real commits (queue/concurrency); tables are truncated afterwards",
    "invariant(id): test proves the named invariant (INV-nn)",
    "meta_live: needs live Meta credentials (never run in CI)",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from the rest of the app"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.identity",
    "app.knowledge",
    "app.audit",
    "app.jobs",
    "app.api",
    "app.demo",
    "app.main",
    "app.worker",
    "app.cli",
]

[[tool.importlinter.contracts]]
name = "audit and jobs depend only on core"
type = "forbidden"
source_modules = ["app.audit", "app.jobs"]
forbidden_modules = [
    "app.identity",
    "app.knowledge",
    "app.api",
    "app.demo",
    "app.main",
    "app.worker",
    "app.cli",
]

[[tool.importlinter.contracts]]
name = "identity does not depend on knowledge"
type = "forbidden"
source_modules = ["app.identity"]
forbidden_modules = ["app.knowledge"]

[[tool.importlinter.contracts]]
name = "services, repositories and models do not import the API layer"
type = "forbidden"
source_modules = [
    "app.core",
    "app.audit",
    "app.jobs",
    "app.identity.service",
    "app.identity.repository",
    "app.identity.models",
    "app.identity.schemas",
    "app.identity.permissions",
    "app.knowledge.service",
    "app.knowledge.repository",
    "app.knowledge.models",
    "app.knowledge.schemas",
    "app.knowledge.candidates",
    "app.knowledge.readiness",
    "app.knowledge.usability",
    "app.knowledge.templates",
    "app.knowledge.transitions",
    "app.knowledge.values",
    "app.knowledge.parsing",
    "app.knowledge.formatting",
    "app.knowledge.constants",
    "app.knowledge.render",
    "app.knowledge.claims",
    "app.knowledge.impact",
    "app.integrations",
    "app.operations.accounts",
    "app.operations.schemas",
    "app.inbox.models",
    "app.inbox.ingest",
    "app.inbox.processing",
    "app.inbox.drafts",
    "app.inbox.attention",
    "app.inbox.transitions",
    "app.inbox.system",
    "app.inbox.echoes",
    "app.inbox.payloads",
    "app.inbox.jobs",
    "app.inbox.context",
    "app.inbox.drafting",
    "app.inbox.language",
    "app.inbox.escalation",
    "app.knowledge.approved_answers",
    "app.ai",
    "app.approvals.service",
    "app.approvals.repository",
    "app.approvals.models",
    "app.approvals.guards",
    "app.approvals.callbacks",
    "app.approvals.transitions",
    "app.approvals.jobs",
    "app.notifications.service",
    "app.notifications.models",
    "app.commands.service",
    "app.commands.repository",
    "app.commands.models",
    "app.commands.resolver",
    "app.commands.registry",
    "app.commands.transitions",
    "app.commands.jobs",
    "app.commands.executors",
]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "demo is imported only by main and cli"
type = "forbidden"
source_modules = [
    "app.core",
    "app.identity",
    "app.knowledge",
    "app.audit",
    "app.jobs",
    "app.api",
    "app.worker",
]
forbidden_modules = ["app.demo"]

[[tool.importlinter.contracts]]
name = "only app.ai imports the LLM integration (ADR-009)"
type = "forbidden"
source_modules = [
    "app.core",
    "app.identity",
    "app.knowledge",
    "app.audit",
    "app.jobs",
    "app.api",
    "app.demo",
    "app.main",
    "app.worker",
    "app.cli",
]
forbidden_modules = ["app.integrations.llm"]
allow_indirect_imports = true  # app.ai legitimately reaches it; only direct imports matter

[[tool.importlinter.contracts]]
name = "only the OpenAI adapter imports the openai SDK"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["openai"]
ignore_imports = ["app.integrations.llm.openai_provider -> openai"]

[[tool.importlinter.contracts]]
name = "only the API, the loader and the worker reach the command system (INV-03)"
type = "forbidden"
source_modules = [
    "app.core",
    "app.identity",
    "app.knowledge",
    "app.audit",
    "app.jobs",
    "app.ai",
    "app.approvals",
    "app.notifications",
    "app.inbox",
    "app.operations",
    "app.integrations",
]
forbidden_modules = ["app.commands"]

[[tool.importlinter.contracts]]
name = "approvals and notifications know no subject module"
type = "forbidden"
source_modules = ["app.approvals", "app.notifications"]
forbidden_modules = ["app.knowledge", "app.commands", "app.ai"]

[[tool.importlinter.contracts]]
name = "knowledge core does not depend on ai, approvals or commands"
type = "forbidden"
source_modules = [
    "app.knowledge.service",
    "app.knowledge.repository",
    "app.knowledge.models",
    "app.knowledge.candidates",
    "app.knowledge.impact",
    "app.knowledge.render",
    "app.knowledge.claims",
    "app.knowledge.formatting",
    "app.knowledge.parsing",
    "app.knowledge.values",
]
forbidden_modules = ["app.ai", "app.approvals", "app.commands"]

[[tool.importlinter.contracts]]
name = "Instagram integrations import only core (component-design.md §3)"
type = "forbidden"
source_modules = ["app.integrations.instagram"]
forbidden_modules = [
    "app.identity",
    "app.knowledge",
    "app.audit",
    "app.jobs",
    "app.ai",
    "app.approvals",
    "app.notifications",
    "app.commands",
    "app.inbox",
    "app.policy",
    "app.operations",
    "app.demo",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "inbox uses only the webhook side of the Instagram integration (INV-15)"
type = "forbidden"
source_modules = ["app.inbox", "app.knowledge"]
forbidden_modules = ["app.integrations.instagram.mock"]
allow_indirect_imports = true  # the registry builds the mock; only direct use is forbidden
