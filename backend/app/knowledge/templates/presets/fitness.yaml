# Optional preset for fitness businesses: gyms, Pilates, yoga (ADR-023).
# A preset only suggests items and hashtags; readiness comes from common.yaml alone.
hashtags:
  tr: [spor, sağlıklıyaşam, fitness]
  en: [fitness, healthylifestyle, workout]
items:
  - key: pricing.membership_monthly
    category: pricing
    label: {tr: Aylık üyelik, en: Monthly membership}
    value_types: [money]
    criticality: critical
    description:
      tr: Aylık üyelik ücreti.
      en: The monthly membership price.

  - key: pricing.membership_3_months
    category: pricing
    label: {tr: 3 aylık üyelik, en: 3-month membership}
    value_types: [money]
    criticality: critical
    description:
      tr: 3 aylık üyelik paketi ücreti.
      en: The 3-month membership package price.

  - key: pricing.single_session
    category: pricing
    label: {tr: Tek seans, en: Single session}
    value_types: [money]
    criticality: critical
    description:
      tr: Tek seanslık giriş ücreti.
      en: The price of a single session.

  - key: pricing.reformer_8_sessions
    category: pricing
    label: {tr: Reformer 8 seans, en: Reformer 8 sessions}
    value_types: [money]
    criticality: critical
    description:
      tr: 8 seanslık reformer paketi ücreti.
      en: The price of an 8-session reformer package.

  - key: pricing.student_monthly
    category: pricing
    label: {tr: Öğrenci aylık üyelik, en: Student monthly membership}
    value_types: [money]
    criticality: critical
    description:
      tr: Öğrenciler için aylık üyelik ücreti.
      en: The monthly membership price for students.

  - key: schedule.classes
    category: schedule
    label: {tr: Ders programı, en: Class schedule}
    value_types: [localized_text]
    criticality: critical
    description:
      tr: Ders programı metni. Saatler yine de doğrulanır.
      en: The class timetable as text. Times in it are still checked.

