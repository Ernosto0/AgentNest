<!doctype html>
<html lang="tr">
  <head>

    <meta
      name="description"
      content="Pivoris rutin Instagram mesajlarını otomatik yanıtlar, yorumları özel sohbete taşır ve içeriklerinizi planlar. Telegram’dan yönetin, WhatsApp’tan gelişmeleri takip edin."
    />
    <!-- Per OS scheme until the page loads; App.tsx then sets both to the visitor's chosen theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1410" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pivoris" />
    <meta property="og:title" content="Siz işletmenize odaklanın. Rutin işleri Pivoris halletsin." />
    <meta
      property="og:description"
      content="Rutin sorular otomatik yanıtlansın, yorumlar özel sohbete dönüşsün. Telegram’dan talimat verin, WhatsApp’tan gelişmeleri takip edin."
    />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:image" content="./social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pivoris" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./social-card.png" />
    <meta name="twitter:image:alt" content="Pivoris" />
    <meta name="twitter:title" content="Siz işletmenize odaklanın. Rutin işleri Pivoris halletsin." />
    <meta
      name="twitter:description"
      content="Rutin sorular otomatik yanıtlansın, yorumlar özel sohbete dönüşsün. Telegram’dan talimat verin, WhatsApp’tan gelişmeleri takip edin."
    />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- Before first paint: apply the saved theme, light by default. External so a strict CSP can block inline scripts. -->
    <script src="./theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Pivoris: küçük işletmeler için Instagram asistanı. Bu sayfa JavaScript gerektirir. /
