# Production & Optional Staging Docker Compose Stack (P8-01, P8-12; deployment.md §2).
#
# Usage:
#   Single-VPS (with bundled PostgreSQL container):
#     docker compose -f compose.prod.yml --env-file .env up -d --build
#
#   External managed PostgreSQL (omit local postgres container):
#     docker compose -f compose.prod.yml --env-file .env up -d --build api worker caddy
#
#   Run database migrations before rolling restart (Session 03 / deployment.md §2):
#     docker compose -f compose.prod.yml --env-file .env --profile migrate run --rm migrate
#
#   Optional staging environment (P8-12, isolated stack/volumes/hostname on same or separate VM):
#     COMPOSE_PROJECT_NAME=agentnest-staging ENV_FILE=.env.staging \
#       docker compose -f compose.prod.yml --env-file .env.staging up -d

name: ${COMPOSE_PROJECT_NAME:-agentnest}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-backend-common: &backend-common
  image: ${AGENTNEST_BACKEND_IMAGE:-ghcr.io/agentnest/agentnest-backend:${IMAGE_TAG:-latest}}
  build:
    context: .
    dockerfile: Dockerfile
    target: backend
  init: true
  user: "10001:10001"
  env_file:
    - path: ${ENV_FILE:-.env}
      required: false
  environment:
    APP_ENV: ${APP_ENV:-production}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentnest}
      POSTGRES_DB: ${POSTGRES_DB:-agentnest}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agentnest} -d $${POSTGRES_DB:-agentnest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    <<: *backend-common
    profiles:
      - migrate
      - ops
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend

  api:
    <<: *backend-common
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
      # Runtime containers must never hold privileged DDL credentials (ADR-025 §1.1).
      MIGRATION_DATABASE_URL: ""
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${WEB_CONCURRENCY:-2}"
      - --timeout-graceful-shutdown
      - "10"
    expose:
      - "8000"
    volumes:
      - media_data:/app/backend/var/media
    networks:
      - edge
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend-common
    restart: unless-stopped
    # Exceeds SHUTDOWN_GRACE_SECONDS (30s) in app/jobs/worker.py so in-flight jobs drain cleanly (INV-07).
    stop_grace_period: 35s
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
      # Runtime containers must never hold privileged DDL credentials (ADR-025 §1.1).
      MIGRATION_DATABASE_URL: ""
    command: ["python", "-m", "app.worker"]
    volumes:
      - media_data:/app/backend/var/media
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from app.core.db import check_readiness; assert check_readiness().ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: ${AGENTNEST_CADDY_IMAGE:-ghcr.io/agentnest/agentnest-caddy:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      CADDY_TLS_CONFIG: ${CADDY_TLS_CONFIG:-}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      SPA_ROOT: /srv/app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
