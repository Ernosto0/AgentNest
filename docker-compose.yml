services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentnest
      POSTGRES_PASSWORD: agentnest
      POSTGRES_DB: agentnest
    ports:
      - "5433:5432"
    volumes:
      - agentnest_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnest -d agentnest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentnest_pgdata:
