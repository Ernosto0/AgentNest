services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pivoris
      POSTGRES_PASSWORD: pivoris
      POSTGRES_DB: pivoris
    ports:
      - "5433:5432"
    volumes:
      - pivoris_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivoris -d pivoris"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pivoris_pgdata:
