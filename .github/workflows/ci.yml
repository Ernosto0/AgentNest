name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No external credentials and no network egress beyond package installation are needed
# (INV-14, AC-X8): the stack runs with the fake/mock/local defaults.
env:
  DATABASE_URL: postgresql+psycopg://agentnest:agentnest@localhost:5433/agentnest
  TEST_DATABASE_URL: postgresql+psycopg://agentnest:agentnest@localhost:5433/agentnest_test

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentnest
          POSTGRES_PASSWORD: agentnest
          POSTGRES_DB: agentnest
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentnest -d agentnest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Create the test database
        run: PGPASSWORD=agentnest psql -h localhost -p 5433 -U agentnest -d agentnest -c "CREATE DATABASE agentnest_test"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Import rules (component-design.md §3)
        run: uv run lint-imports
      - name: Tests (unit, integration, isolation, security, jobs)
        run: uv run pytest
      # Deterministic fake provider: proves the pipeline (prompts, schemas, resolver, extraction
      # checks) and the hard assertions (INV-02/03/04). Real-provider evals are run by hand.
      - name: AI evals (fake provider)
        run: uv run python -m evals run --all --provider fake --strict --no-report

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run i18n:check
        working-directory: frontend
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Regenerate the OpenAPI client and fail if the committed copy differs
        run: |
          cd backend
          uv python install 3.12
          uv sync --locked
          uv run python -m app.cli export-openapi -o ../frontend/openapi.json
          cd ../frontend
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentnest
          POSTGRES_PASSWORD: agentnest
          POSTGRES_DB: agentnest
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentnest -d agentnest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies and migrations
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --locked
          uv run alembic upgrade head
      - name: Frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      # Playwright seeds the demo data (global-setup.ts), starts the API and serves the
      # production build with `vite preview` (see e2e/playwright.config.ts).
      - name: Playwright (mobile-webkit, mobile-chromium, desktop-chromium)
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
